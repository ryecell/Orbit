<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #0C2A1F; color: #E7F5EE; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 380px; }
  .dot { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #3DDC97; border-top-color: transparent; margin: 0 auto 22px; animation: spin 1.1s linear infinite; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #9CC5B3; font-size: 14px; line-height: 1.5; }
  button { background: #0A8454; color: #fff; border: 0; border-radius: 12px; padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <h1>Can't reach Orbit</h1>
    <p>Check your internet connection. If it's fine, the server may be waking up — this page will retry by itself.</p>
    <button id="retry">Try again</button>
  </div>
<script>
  var target = new URLSearchParams(location.search).get("u");
  function go() { if (target) location.href = target; }
  function probe() {
    if (!target) return;
    fetch(target, { mode: "no-cors", cache: "no-store" }).then(go).catch(function () {});
  }
  document.getElementById("retry").addEventListener("click", go);
  setInterval(probe, 5000);
</script>
</body>
</html>
