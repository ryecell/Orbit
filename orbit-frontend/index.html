<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <meta name="theme-color" content="#0A8454" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Global so both are available on every screen, including ones that
         render before MainShell ever mounts (sign-in, reset-password,
         verify-pending) — copies scoped only inside MainShell wouldn't cover those. */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body style="margin:0; background:#FFFFFF;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
