name: Frontend CI

on:
  push:
    paths: ["orbit-frontend/**"]
  pull_request:
    paths: ["orbit-frontend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbit-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: orbit-frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_BASE: https://example.invalid
        run: npm run build
